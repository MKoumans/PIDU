[project]
name = "pidu"
version = "1.0.0"
description = "Physics-infused deep unfolding for material parameter extraction from optical spectra"
authors = [
    {name = "Milan Koumans", email = "m.koumans@tue.nl"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "torch>=2.8",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "openpyxl>=3.1.5,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "scipy>=1.16.3,<2.0.0",
    "cvxpy>=1.7.5,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "huggingface-hub>=1.22.0,<2.0.0",
    "tqdm>=4.66",
]

[project.scripts]
pidu-train = "pidu.train:main"
pidu-hub = "pidu.hub:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pidu"]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ipykernel>=7.1.0,<8.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "scienceplots>=2.2.1,<3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow: simulates a dataset"]
